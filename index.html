<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kernel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<header class="header">
    <div class="container header-inner">
        <div class="header-glow" aria-hidden="true"></div>
        <a href="https://github.com/mauriciospark/kernel" target="_blank" rel="noopener noreferrer"
            class="header-badge">
            <img src="https://img.shields.io/github/stars/mauriciospark/kernel?style=social" alt="GitHub Stars"
                loading="lazy">
        </a>
    </div>
</header>

<body>
    <header>
        <div class="header-brand">
            <img src="favicon/ms-icon-310x310.png" alt="Logo" class="logo">
            <h1>Kernel</h1>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar livros...">
            <select id="genreFilter">
                <option value="">Todos os gêneros</option>
            </select>
        </div>
    </header>

    <main>
        <div id="booksGrid" class="books-grid">
            <!-- Os livros serão carregados aqui via JavaScript -->
        </div>
    </main>

    <div id="bookModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody">
                <!-- Detalhes do livro serão exibidos aqui -->
            </div>
        </div>
    </div>
</body>
<script src="javascript/script.js"></script>
<script src="javascript/config.js"></script>

</html>
